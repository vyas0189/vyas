[build]
  command = "bun run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[functions]
  node_bundler = "esbuild"

# Long-cache hashed Astro assets
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Site-wide security headers. The Content-Security-Policy is NOT here — it is
# generated post-build into dist/_headers by scripts/generate-headers.mjs,
# because its inline-script hashes change with every build (Sentry debug IDs).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# Source maps: Sentry deletes them after upload, and CI fails the build if any
# remain in dist/, so none are ever published.
#
# Preview noindex: netlify.toml headers can't vary by deploy context, so
# scripts/generate-headers.mjs adds X-Robots-Tag to dist/_headers on PR builds.
