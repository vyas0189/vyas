name: OpenSSF Scorecard

# Grades the repo's supply-chain setup (pinned actions, token permissions,
# branch protection, dependency updates, …) and files the findings as
# code-scanning alerts under the Security tab.
on:
  branch_protection_rule:
  schedule:
    # Weekly, Monday 07:20 UTC
    - cron: '20 7 * * 1'
  push:
    branches: [main]
  workflow_dispatch:

# Everything read-only unless a job asks for more.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Upload the SARIF to code scanning.
      security-events: write
      # OIDC token for publish_results (public badge and API at scorecard.dev).
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: results.sarif
