name: CI/CD Pipeline

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', 'PROMPT.md']
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', 'PROMPT.md']

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only by default; each job asks for exactly what it needs.
permissions:
  contents: read

env:
  BUN_VERSION: "1.4.5"
  # Exact versions so a new upstream release can't change what runs with the
  # Netlify token. Renovate bumps these like any other pin.
  NETLIFY_CLI_VERSION: "27.20.1"

jobs:
  build-and-test:
    name: Build and Unit Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check lockfiles agree
        run: bun run check:lockfiles

      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Type check
        run: bun run check

      - name: Run unit tests
        run: bun run test:unit

      - name: Build project
        run: bun run build
        env:
          PUBLIC_SENTRY_DSN: ${{ secrets.PUBLIC_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          PUBLIC_COMMIT_REF: ${{ github.sha }}
          # PR builds deploy to a Netlify preview, so tag their Sentry events
          # and keep the preview out of search results.
          PUBLIC_DEPLOY_CONTEXT: ${{ github.event_name == 'pull_request' && 'deploy-preview' || 'production' }}
          NOINDEX: ${{ github.event_name == 'pull_request' && '1' || '' }}

      # Sentry deletes source maps after upload; fail rather than publish any
      # it missed.
      - name: Verify no source maps in build
        run: |
          if find dist -name '*.map' | grep -q .; then
            echo "::error::Source maps found in dist/"
            find dist -name '*.map'
            exit 1
          fi

      - name: Bundle size check
        run: bun run size

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: netlify-build
          path: |
            .netlify/
            dist/
          retention-days: 1

  deploy:
    name: Deploy to Netlify
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      deploy_url: ${{ steps.netlify-deploy.outputs.deploy_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: netlify-build

      - name: Verify build artifacts
        run: |
          echo "Contents of .netlify folder:"
          ls -la .netlify/ || echo "No .netlify folder"
          echo "Contents of dist folder:"
          ls -la dist/ || echo "No dist folder"

      - name: Install Netlify CLI
        run: bun install -g "netlify-cli@${NETLIFY_CLI_VERSION}"

      - name: Deploy to Netlify
        id: netlify-deploy
        # Branch names are attacker-chosen text: pass them (and the secrets)
        # through env so they're never pasted into the script itself. The CLI
        # reads NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID from the environment.
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          prod_flag=""
          if [ "$BRANCH_NAME" = "main" ]; then prod_flag="--prod"; fi

          netlify deploy \
            $prod_flag \
            --json \
            > deploy_output.json

          cat deploy_output.json

          # Extract deploy URL
          DEPLOY_URL=$(cat deploy_output.json | jq -r '.deploy_url // .url')
          echo "deploy_url=$DEPLOY_URL" >> $GITHUB_OUTPUT
          echo "Deployed to: $DEPLOY_URL"

  e2e-tests:
    name: E2E Tests
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: pw-${{ runner.os }}-

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Wait for deploy to be live
        env:
          URL: ${{ needs.deploy.outputs.deploy_url }}
        run: |
          for i in {1..30}; do
            if curl -fsS --max-time 5 "$URL" >/dev/null; then
              echo "Deploy is live at $URL"
              exit 0
            fi
            echo "Attempt $i: not yet ready, waiting 2s..."
            sleep 2
          done
          echo "::error::Deploy did not become reachable within 60s"
          exit 1

      - name: Run E2E tests
        run: bun run test:e2e
        env:
          PLAYWRIGHT_TEST_BASE_URL: ${{ needs.deploy.outputs.deploy_url }}
          RESEND_TO_EMAIL: ${{ secrets.RESEND_TO_EMAIL }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  comment-pr:
    name: Comment on PR
    if: github.event_name == 'pull_request' && always()
    needs: [deploy, e2e-tests]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Sticky PR comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: deploy-status
          message: |
            ### Deploy & test results
            - Deploy: ${{ needs.deploy.result }}
            - E2E: ${{ needs.e2e-tests.result }}
            - Preview: ${{ needs.deploy.outputs.deploy_url }}

  lighthouse:
    needs: [deploy, e2e-tests]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install
        run: bun install --frozen-lockfile
      # Uses the @lhci/cli pinned in bun.lock rather than whatever is newest.
      - name: Run Lighthouse CI
        env:
          URL: ${{ needs.deploy.outputs.deploy_url }}
        run: |
          bunx lhci autorun \
            --collect.url="$URL" \
            --collect.url="$URL/about" \
            --collect.url="$URL/contact"
